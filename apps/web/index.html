<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0f0a1a" />
    <meta name="description" content="Losh: PDF kitaplarını kağıt ya da gece tonunda gösteren, ücretsiz ve açık kaynak, göz dostu okuyucu." />
    <title>Losh — Göz dostu PDF okuyucu</title>
    <!-- Share previews need full addresses; update them if Losh moves to its own domain. -->
    <link rel="canonical" href="https://loshreader.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Losh" />
    <meta property="og:title" content="Losh — Göz dostu PDF okuyucu" />
    <meta property="og:description" content="PDF kitaplarını kağıt ya da gece tonunda oku. Ücretsiz, açık kaynak, internetsiz çalışır; dosyan cihazından çıkmaz." />
    <meta property="og:url" content="https://loshreader.vercel.app/" />
    <meta property="og:image" content="https://loshreader.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Losh logosu ve aynı sayfanın beyaz, kağıt ve gece tonları" />
    <meta property="og:locale" content="tr_TR" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Losh" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Keeps the prerendered copy hidden until the page redraws in the reader's language (src/prerendered.ts).
         Only runs with JavaScript on; its hash is allowed in the CSP in vercel.json, and the build checks that. -->
    <script>document.documentElement.classList.add('losh-boot')</script>
    <style>
      html { background: #0f0a1a; }
      body { margin: 0; }
      /* Shown anyway after a moment if the page never wakes up. */
      .losh-boot [data-prerendered] { visibility: hidden; animation: losh-show 0s 4s forwards; }
      @keyframes losh-show { to { visibility: visible; } }
    </style>
  </head>
  <body>
    <div id="home" data-prerendered></div>
    <script type="module" src="./src/home/main.tsx"></script>
  </body>
</html>
